spring.application.name=educoders-prototipo-arquitectura
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/educoders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:educoders}
spring.datasource.password=${DB_PASSWORD:educoders123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
