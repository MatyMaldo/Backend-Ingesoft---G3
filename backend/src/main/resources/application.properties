spring.application.name=educoders-prototipo-arquitectura
server.port=${PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones (Hikari). Con la BD remota (RDS), una conexión inactiva puede ser cerrada por la red sin que el
# pool lo note; sin estos valores esa conexión se descubre muerta recién al usarla (hasta 30 s por conexión).
# El keepalive la sondea antes y max-lifetime la renueva antes de que la red la corte.
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# Compresión de las respuestas JSON: el listado de usuarios trae miles de filas y sin comprimir pesa del orden de 1 MB.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Configuración de correo (Dummy para desarrollo)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${MAIL_FROM}

# Configuración de Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.hibernate.ddl-auto=validate
# Logs SQL apagados por defecto (ralentizan las operaciones masivas).
# Para verlos en local: crear application-dev.properties (ignorado por git) y activar el perfil "dev".
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Tarifas de los compromisos de pago
app.pagos.monto-matricula=350.00
app.pagos.monto-pension=450.00

# Restablecimiento de contraseña
app.password-reset.expiracion-minutos=15
app.password-reset.cooldown-segundos=60
app.password-reset.max-intentos=5

# Jornada escolar y receso para la programación de horarios
app.horarios.jornada-inicio=08:00
app.horarios.jornada-fin=13:30
app.horarios.receso-inicio=11:00
app.horarios.receso-fin=11:30